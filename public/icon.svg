<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1A13"/>
      <stop offset="100%" stop-color="#190F0B"/>
    </linearGradient>
    <linearGradient id="cakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2E23"/>
      <stop offset="100%" stop-color="#311B13"/>
    </linearGradient>
    <linearGradient id="frostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#704432"/>
      <stop offset="100%" stop-color="#553022"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  
  <!-- Base background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Brownie cake layer -->
  <rect x="96" y="160" width="320" height="230" rx="36" fill="url(#cakeGrad)" stroke="#5B382A" stroke-width="6"/>
  
  <!-- Chocolate ganache drizzle top -->
  <path d="M96 220 C130 240, 160 210, 190 230 C220 250, 250 210, 280 235 C310 260, 340 220, 370 240 C395 255, 410 230, 416 220 L416 196 C416 176, 400 160, 380 160 L132 160 C112 160, 96 176, 96 196 Z" fill="url(#frostGrad)"/>
  
  <!-- Golden Crown / Control Symbol -->
  <path d="M206 130 L226 100 L256 122 L286 100 L306 130 Z" fill="url(#goldGrad)" stroke="#B45309" stroke-width="4"/>
  <circle cx="256" cy="94" r="8" fill="#FDE68A"/>
  <circle cx="222" cy="96" r="6" fill="#FDE68A"/>
  <circle cx="290" cy="96" r="6" fill="#FDE68A"/>

  <!-- Pix Sparkle & Text Monogram -->
  <text x="256" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="72" fill="#F5EBE6" text-anchor="middle" letter-spacing="2">BC</text>
  <text x="256" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#D97706" text-anchor="middle" letter-spacing="4">CONTROL</text>
</svg>
